# 2. Add repository secrets (Settings → Secrets and variables → Actions):
#      VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#    The two ids are in `.vercel/project.json` after running `npx vercel link`.
