name: CI

# Quality gate for every push to main.
#
# Deployment is handled by Vercel's Git integration: when this repository is
# imported into Vercel, every push to `main` builds and publishes to production
# automatically (README → Deployment). This workflow therefore only verifies the
# code — it must stay green, but it does not deploy.
#
# Want GitHub Actions to be the deployer instead? See the commented-out `deploy`
# job at the bottom: it needs three repository secrets and Vercel's own Git
# deployments switched off (otherwise every push publishes twice).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must match the Node version used by Vercel and locally (≥ 20.9).
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` needs a lockfile that satisfies every peer dependency; the
        # package.json / package-lock.json pair is kept in sync for this.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

# ─────────────────────────────────────────────────────────────────────────────
# Optional: deploy from GitHub Actions instead of Vercel's Git integration.
